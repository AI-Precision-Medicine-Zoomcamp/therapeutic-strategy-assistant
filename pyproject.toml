[project]
name = "therapeutic-strategy-assistant"
version = "0.1.0"
description = "Evidence-grounded therapeutic strategy retrieval assistant for biomedical research support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.3.6",
    "dlt[duckdb]>=1.29.1",
    "fastapi>=0.138.0",
    "openai>=2.43.0",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
