services:
  postgres:
    image: postgres:16
    container_name: therapeutic-strategy-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-therapeutic_strategy}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-therapeutic_strategy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: therapeutic-strategy-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANSWER_EVALUATION_MODE: ${ANSWER_EVALUATION_MODE:-llm}
      OPENAI_INPUT_PRICE_PER_1M: ${OPENAI_INPUT_PRICE_PER_1M:-0}
      OPENAI_OUTPUT_PRICE_PER_1M: ${OPENAI_OUTPUT_PRICE_PER_1M:-0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-therapeutic_strategy}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./data:/app/data:ro
      - ./chroma_db:/app/chroma_db
    command: sh -c "uv run --no-sync python -m monitoring.telemetry && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"

  streamlit:
    build: .
    container_name: therapeutic-strategy-streamlit
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANSWER_EVALUATION_MODE: ${ANSWER_EVALUATION_MODE:-llm}
      OPENAI_INPUT_PRICE_PER_1M: ${OPENAI_INPUT_PRICE_PER_1M:-0}
      OPENAI_OUTPUT_PRICE_PER_1M: ${OPENAI_OUTPUT_PRICE_PER_1M:-0}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-therapeutic_strategy}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - ./data:/app/data:ro
      - ./chroma_db:/app/chroma_db
    command: uv run --no-sync streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501

  grafana:
    image: grafana/grafana:latest
    container_name: therapeutic-strategy-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:
